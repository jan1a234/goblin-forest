# Temporärer Hilfs-Workflow: gibt API-Signaturen von Minecraft/Fabric aus (nur auf dem Branch dev/api-probe).
name: api-probe
on:
  push:
    branches: ['dev/api-probe']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: Probe
        run: |
          chmod +x ./gradlew
          ./gradlew -q printCp --no-configuration-cache > cp.txt
          if grep -q '^src ' probe/cmds.txt; then ./gradlew -q genSources --no-configuration-cache > /dev/null 2>&1 || echo "genSources fehlgeschlagen"; fi
          bash probe/run.sh
