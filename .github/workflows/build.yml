# Baut die Mod bei jedem Push und Pull Request.
# - Push auf main: aktualisiert das Vorab-Release "dev" mit der neuesten .jar.
# - Git-Tag v* (z. B. v0.1.0): erstellt ein richtiges Release mit der .jar als Download.

name: build
on:
  push:
    branches: ['**', '!ci-screenshots']
    tags: ['v*']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Gradle-Wrapper prüfen
        uses: gradle/actions/wrapper-validation@v6
      - name: JDK 25 einrichten
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
      - name: Version bestimmen
        id: version
        run: |
          base=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base}+build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
      - name: Virtuellen Bildschirm für den Client-Test einrichten
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
      # "build" führt auch die Gametests aus: ein komplettes Match auf einem echten Minecraft-Server.
      - name: Bauen und testen
        run: |
          chmod +x ./gradlew
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew build -Pmod_version="${{ steps.version.outputs.version }}" 2>&1 | tee build.log
      # Startet einen echten Minecraft-Client, spielt ein Match an und macht Bildschirmfotos (ClientMatchGameTest).
      - name: Client-Test mit Bildschirmfotos
        run: |
          set -o pipefail
          if grep -q ":runClientGameTest" build.log; then echo "lief schon in build"; exit 0; fi
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest -Pmod_version="${{ steps.version.outputs.version }}" 2>&1 | tee client.log
      - name: Bildschirmfotos einsammeln
        if: always()
        run: |
          mkdir -p screenshots
          find . -path ./screenshots -prune -o -name '*.png' -path '*screenshots*' -print -exec cp {} screenshots/ \; || true
          ls -la screenshots
      - name: Bildschirmfotos hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ steps.version.outputs.version }}
          path: screenshots/
          if-no-files-found: ignore
      # Die Bildschirmfotos zusätzlich im Branch "ci-screenshots" ablegen, damit man sie direkt auf GitHub ansehen kann
      # (wird bei jedem Lauf überschrieben).
      - name: Bildschirmfotos im Branch ci-screenshots ablegen
        if: always() && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls screenshots/*.png > /dev/null 2>&1 || exit 0
          cd screenshots
          printf '# Bildschirmfotos aus dem Client-Test\n\nStand: %s (Branch %s)\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.md
          for f in *.png; do printf '\n## %s\n\n![%s](%s)\n' "${f%.png}" "$f" "$f" >> README.md; done
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Bildschirmfotos zu $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
      - name: Ergebnis des Match-Tests
        if: always()
        run: grep -h -E "Selbsttest|required tests|tests? (passed|failed)|goblinforest-test:|[Cc]lient ?[Gg]ame ?[Tt]est" build.log client.log 2>/dev/null | tail -30 || true
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          echo "===== FEHLER-ZUSAMMENFASSUNG ====="
          cat build.log client.log 2>/dev/null | grep -n -E "error:|Exception|Caused by|Description:|GameTest|gametest|FAILED|failed|ERROR|WARN.*goblinforest|[Dd]imension|arena|\[goblinforest|AssertionError|[Mm]ixin" | grep -v "fabric-gametest-api-v1:" | head -150
          echo "===== ENDE ====="
      - name: Build-Ergebnis hochladen
        uses: actions/upload-artifact@v7
        with:
          name: goblinforest-${{ steps.version.outputs.version }}
          path: build/libs/

      - name: Entwicklungs-Release "dev" aktualisieren
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jar=$(ls build/libs/goblinforest-*.jar | grep -v -- '-sources.jar')
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev "$jar" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Entwicklungsversion $VERSION" \
            --notes "Automatisch gebaut aus dem neuesten Stand von main (Commit $GITHUB_SHA). Noch nicht fertig, nur zum Testen. Benötigt Minecraft 26.2, Fabric Loader 0.19.5+ und Fabric API."

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/goblinforest-*.jar | grep -v -- '-sources.jar')
          gh release create "$GITHUB_REF_NAME" "$jar" \
            --title "Goblin Forest $GITHUB_REF_NAME" \
            --generate-notes
